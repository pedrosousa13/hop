[package]
name = "hopd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `version` alongside `path` for the reason given in `hop-core/Cargo.toml`: a
# bare path dependency is a wildcard requirement, which `cargo deny check
# bans` flags, and quieting the gate instead would mean marking this crate
# unpublishable to silence a lint that is right on the merits.
hop-core = { path = "../hop-core", version = "0.1.0" }
hop-protocol = { path = "../hop-protocol", version = "0.1.0" }
# `net` and `rt-multi-thread` add the accept loop and the multi-threaded
# runtime the brief requires on top of the workspace's `sync`, `time`,
# `macros`, `rt` set; `io-util` adds `AsyncReadExt`/`AsyncWriteExt` for the
# per-connection read/write loop.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util"] }
inotify.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
