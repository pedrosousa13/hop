name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # apps/hop-gtk (issue #179) links against the system GTK4 and
      # libadwaita, discovered through `pkg-config` by the gtk4-rs/
      # libadwaita-rs `-sys` crates' `build.rs` — a plain `cargo build` (and
      # so `clippy`/`test` below, which both compile the workspace first)
      # fails outright without the `-dev` packages' headers and `.pc` files.
      # `libgtk-4-bin` is the third package for a reason that is easy to
      # miss and easy to get wrong: it provides `gtk4-broadwayd`, the GTK4
      # headless display server `apps/hop-gtk/tests/headless_smoke.rs`
      # spawns to satisfy this issue's criterion 8 (headless capture in
      # CI). The *other* thing named `broadwayd` that Ubuntu ships,
      # `libgtk-3-bin`'s own binary of the same name, speaks GTK3's
      # incompatible broadway protocol and cannot serve a GTK4 client at
      # all — installing only `libgtk-4-dev` (headers) without
      # `libgtk-4-bin` (this binary) would build cleanly and then fail
      # `headless_smoke.rs` at run time with "failed to spawn
      # gtk4-broadwayd", which is exactly the trap that test's own doc
      # comment documents having hit once already while this was built.
      # `libadwaita-1-dev` is the same story one layer up, for
      # `apps/hop-gtk`'s libadwaita dependency.
      #
      # Issue #232 adds two packages for its Xvfb arm, each load-bearing:
      #
      # `xvfb` provides `Xvfb`, the X server `tests/x11_smoke.rs` spawns to
      # prove hop-gtk's X11 overlay end to end (centered map, focus-loss
      # dismissal, --screenshot capture, socket round trip). Broadway
      # cannot stand in for this: it is a different display protocol, and
      # only a real X server exercises GDK's X11 backend. The test skips
      # with a printed reason when `Xvfb` is absent — which is what makes
      # the same `cargo test --workspace` pass on machines without it — so
      # installing the package here is what turns the skip into a hard,
      # passing requirement.
      #
      # `dbus` provides `dbus-run-session`, which the same test's
      # interactive arm wraps hop-gtk in: a unique GApplication registers
      # on the session bus, and GitHub runners have no user session bus
      # running, so without a private bus that arm would die in
      # GApplication registration before a window ever mapped.
      - name: Install GTK4 + libadwaita + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libgtk-4-bin libadwaita-1-dev xvfb dbus

      # Pinned to the exact version `rust-toolchain.toml` pins, not left on
      # `@stable`: an unpinned action would install whatever is newest that
      # day, and if that ever drifted from the version this repo's own
      # `rust-toolchain.toml` names, `cargo` would silently auto-install a
      # *second* toolchain to honour the override file (rustup resolves that
      # file ahead of whatever this step's `rustup default` sets — see the
      # comment there for how that was verified) instead of using the one
      # this step just installed. Keeping both pins equal is what makes this
      # step's install actually the one that runs, rather than a wasted
      # download. See `rust-toolchain.toml` for why 1.98.0 specifically is
      # pinned rather than floating (issue #223).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # A separate job, not a step in `ci`: it never compiles the workspace, so it
  # wants neither the rustfmt/clippy components nor the build cache — and, the
  # reason that matters, it reports as its own red check. "Supply chain failed"
  # and "a test failed" are different problems for a reviewer, and one job would
  # collapse them into a single status.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SHA-pinned, not `@v2` and not the `v2.1.1` tag it names: a gate whose job
      # is to stop dependency drift should not itself float. Bumping it is then a
      # deliberate edit with a diff.
      #
      # `command: check` with no arguments runs all four checks — advisories,
      # bans, licenses, sources — under the policy in `deny.toml` at the repo
      # root, so the gate is configured in a reviewed file rather than in flags
      # buried here. `arguments: ""` overrides the action's `--all-features`
      # default so `deny.toml`'s `[graph]` decides the feature set; the workspace
      # declares no optional features today, and the override is here for when
      # that stops being true.
      #
      # The advisory database is cloned over the network at run time, so an
      # outage or a rate limit turns this job red rather than green. That is the
      # right direction to fail — a gate that passes because it could not reach
      # the advisory list is worse than no gate — but it means a red `Supply
      # chain` check should be read before it is believed. If it proves flaky,
      # cache the database rather than making the check advisory.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""

  # A separate job, not a step in `ci`, for the same reason `supply-chain`
  # is one: a timing failure and a correctness failure are different
  # problems for a reviewer, and one job would collapse their statuses
  # together. This one *does* compile the workspace (in `--release`, unlike
  # `ci`'s debug build), so unlike `supply-chain` it does want the
  # rustfmt/clippy-less toolchain and the build cache.
  #
  # The four tests this job runs (`crates/hop-core/tests/latency.rs`) are
  # `#[ignore]`d specifically so `ci`'s own `cargo test --workspace` — a
  # debug build — never runs them: debug-mode Rust is 10-50x slower than
  # release for CPU-bound fuzzy matching, so a 10ms p95 budget measured in
  # debug mode would flake on ordinary, unregressed code. `--release` is
  # therefore load-bearing here, not a performance nicety.
  #
  # `--test-threads=1` keeps the four timing tests in this one small binary
  # from contending with each other for CPU during measurement, which
  # parallel test execution would otherwise do by default.
  #
  # Not every test this job runs still gates it. Two of the four arms are
  # report-only. The files-shaped p95 arm
  # (`p95_query_latency_over_a_files_shaped_fixture_is_measured_in_release_mode`,
  # issue #134) is report-only: it still builds in `--release`, still runs
  # under `--ignored`, and still prints its p95, but no longer asserts
  # against the 10ms budget — see that test's own doc comment for why. The
  # populated learning-store p95 arm
  # (`p95_query_latency_over_a_populated_learning_store_is_measured_in_release_mode`,
  # issue #149) is likewise report-only: it prints its figure and margin
  # against the reference without asserting a threshold, because no budget
  # exists yet. A red "Latency gate" check here still means a real regression
  # in one of the two arms that does assert
  # (`p95_query_latency_is_under_10ms_in_release_mode` and
  # `bounded_worst_case_completes_promptly_in_release_mode`); it does not mean
  # either report-only arm crossed its line, since neither can fail the build
  # on its own.
  latency-gate:
    name: Latency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version pin as `ci`'s toolchain step, for the same reason: see
      # the comment there and in `rust-toolchain.toml` (issue #223). This
      # step's own component list is untouched by the pin.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Latency gate
        run: cargo test --release -p hop-core --test latency -- --ignored --test-threads=1

  # A separate job, not a step in `ci`, for the same reason `supply-chain` and
  # `latency-gate` are: issue #233's wlroots arm has its own failure shape —
  # "the layer-shell path regressed" or "the compositor/library provisioning
  # broke" is a different problem for a reviewer than a plain test failure —
  # and one job would collapse that status into `ci`'s. It compiles hop-gtk
  # in both feature modes plus the `hopd` binary the smoke tests spawn, so
  # it wants the pinned toolchain and the build cache, and it runs
  # `wlroots_smoke.rs` in *both* of that file's
  # compilation modes, because the file's tests are gated on the feature they
  # exercise: with `--features layer-shell` the sway arm (window really
  # becomes a layer surface — asserted on the Wayland wire via
  # WAYLAND_DEBUG=1, since the --screenshot capture is hop-gtk's own
  # rendering and would look identical either way) and the Weston arm
  # (compositor without zwlr_layer_shell_v1 falls back cleanly) run; with
  # default features the feature-off arm runs under the same sway. All three
  # skip with a printed reason on a machine without their prerequisites,
  # which is exactly what makes the default `cargo test --workspace` in `ci`
  # stay green without any of this provisioning.
  #
  # The provisioning is the interesting part: `ubuntu-latest` is Ubuntu 24.04
  # (noble), which ships **no** gtk4-layer-shell package at all — apt only
  # has `libgtk-layer-shell-dev`, the GTK3 library of the same idea, which
  # the `gtk4-layer-shell` Rust crate's `-sys` build probe (pkg-config name
  # `gtk4-layer-shell-0`, required version >= 1) cannot use. The boring
  # workaround is building the real thing from a pinned commit — v1.0.4's
  # own SHA, not the tag, because a mutable ref is exactly what a
  # provisioning step must not float on (the same philosophy as
  # `supply-chain`'s SHA-pinned action). v1.0.4 satisfies the >= 1 probe;
  # the same version Ubuntu >= 24.10 ships as `libgtk4-layer-shell-dev`, so
  # if the runner image ever moves past noble this whole step can collapse
  # back into one apt package name).
  # docs/tests are the library's own documentation and test suites,
  # introspection/vapi are the Python/Vala bindings whose generators
  # (g-ir-scanner, vapigen) are not installed and would fail the build for
  # nothing. `ldconfig` afterwards is load-bearing, not hygiene: hop-gtk
  # links `libgtk4-layer-shell.so.0` at build time and *loads* it at run
  # time, and without the linker cache refresh the cargo steps below would
  # compile cleanly and then fail to start. `PKG_CONFIG_PATH` (job env) is
  # the same story for compile time — the `/usr/local` pkgconfig directories
  # are on pkg-config's default search path, but the sys-crate probe's
  # failure mode when they are missed is an unreadable "library not found",
  # so the path is spelled out instead of assumed.
  #
  # `sway` provides the wlroots compositor the layer-shell arm runs under
  # (headless backend: `WLR_BACKENDS=headless`, no GPU or input devices —
  # see `tests/wlroots_smoke.rs`'s module doc for the full invocation).
  # `weston` provides the layer-shell-*less* compositor the fallback arm
  # runs under: its headless backend ships in the `libweston-13-0` package
  # `weston` depends on, and Weston implements no `zwlr_layer_shell_v1`,
  # which is precisely the unsupported-compositor answer the probe must stay
  # observable for. `meson`/`ninja-build`/`libwayland-dev`/
  # `wayland-protocols` are the pinned-source build's own prerequisites.
  layer-shell-gate:
    name: Layer shell gate
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 + libadwaita + compositors + gtk4-layer-shell build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev \
            sway weston \
            meson ninja-build libwayland-dev wayland-protocols

      - name: Build and install gtk4-layer-shell v1.0.4 (pinned commit)
        run: |
          git clone https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          git -C /tmp/gtk4-layer-shell checkout 536ff516ed68b9bb34afc4c07f942a54b2b4b03f
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/usr/local \
            -Ddocs=false -Dtests=false -Dintrospection=false -Dvapi=false
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
          pkg-config --modversion gtk4-layer-shell-0

      # Same version pin as `ci`'s toolchain step, for the same reason: see
      # the comment there and in `rust-toolchain.toml` (issue #223). Only
      # clippy is needed — this job does not run `cargo fmt`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # wlroots_smoke.rs spawns `hopd` beside hop-gtk — the query
      # round-trip needs a daemon — and a `-p hop-gtk` test build compiles
      # hopd's library but never its binary, so the gate builds the binary
      # explicitly or every fresh-runner run dies in spawn_daemon.
      - name: Build hopd (the smoke tests' daemon)
        run: cargo build -p hopd

      # The feature-on code (`layer_shell.rs`'s apply branch, `session.rs`'s
      # LayerShell wiring, `window.rs`'s gate) is compiled by no other gate —
      # `ci`'s clippy runs default features — so it is linted here, where the
      # library it needs is installed, rather than left to rot unlinted
      # between CI runs.
      - name: Clippy (layer-shell feature on)
        run: cargo clippy -p hop-gtk --features layer-shell --all-targets -- -D warnings

      - name: "Layer-shell arm (feature on: sway + Weston)"
        run: cargo test -p hop-gtk --features layer-shell --test wlroots_smoke

      - name: "Fallback arm (feature off: sway)"
        run: cargo test -p hop-gtk --test wlroots_smoke

  # A separate job, not a step in `ci`, for the same reason `layer-shell-gate`
  # is: issue #234's Xvfb arm has its own failure shape — "the hotkey path
  # regressed" or "the X/dbus provisioning broke" is a different problem for
  # a reviewer than a plain test failure — and one job would collapse that
  # status into `ci`'s. The arm it runs is `crates/hop-hotkeyd/tests/e2e.rs`,
  # which skips with a printed reason when its prerequisites are absent —
  # exactly what keeps `ci`'s default `cargo test --workspace` green without
  # this provisioning — so installing them here is what turns the skip into
  # a hard, passing requirement, the same move `ci`'s own Xvfb install made
  # for `x11_smoke.rs`.
  #
  # The build step is load-bearing, not hygiene: `cargo test -p hop-hotkeyd`
  # compiles only that package, while the harness drives four binaries from
  # the shared target directory (`hopd`, `hop`, `hop-gtk`, `hop-hotkeyd`)
  # and skips, rather than fails, when a sibling is missing — the same
  # reason `layer-shell-gate` builds `hopd` explicitly. `hop-gtk` is in the
  # list because the toggle chain's last hop is a real re-invocation of it;
  # its GTK system packages are installed above for exactly that link.
  hotkey-gate:
    name: Hotkey gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 + libadwaita + Xvfb + dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libgtk-4-bin libadwaita-1-dev xvfb dbus

      # Same version pin as `ci`'s toolchain step, for the same reason: see
      # the comment there and in `rust-toolchain.toml` (issue #223).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the binaries the harness drives
        run: cargo build -p hopd -p hop-cli -p hop-gtk -p hop-hotkeyd

      - name: Hotkey end-to-end arm
        run: cargo test -p hop-hotkeyd --test e2e
