[package]
name = "hop-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Only for the `O_NONBLOCK` flag on `IconPath::open_regular_file`, which is the
# one place this crate touches the filesystem, and for `mkfifo` in the test that
# covers it. std already links libc; this brings in the flag constant rather than
# a second implementation of it.
#
# These two are the first dependencies the contract crate has taken beyond serde
# and thiserror, and they arrived before this workspace had a supply-chain gate.
# It has one now — `deny.toml` at the repo root, run by the `Supply chain` job in
# CI — and they are checked by it like every other dependency, which is what the
# note that used to stand here asked for.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
