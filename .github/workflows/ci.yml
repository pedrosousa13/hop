name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # apps/hop-gtk (issue #179) links against the system GTK4 and
      # libadwaita, discovered through `pkg-config` by the gtk4-rs/
      # libadwaita-rs `-sys` crates' `build.rs` — a plain `cargo build` (and
      # so `clippy`/`test` below, which both compile the workspace first)
      # fails outright without the `-dev` packages' headers and `.pc` files.
      # `libgtk-4-bin` is the third package for a reason that is easy to
      # miss and easy to get wrong: it provides `gtk4-broadwayd`, the GTK4
      # headless display server `apps/hop-gtk/tests/headless_smoke.rs`
      # spawns to satisfy this issue's criterion 8 (headless capture in
      # CI). The *other* thing named `broadwayd` that Ubuntu ships,
      # `libgtk-3-bin`'s own binary of the same name, speaks GTK3's
      # incompatible broadway protocol and cannot serve a GTK4 client at
      # all — installing only `libgtk-4-dev` (headers) without
      # `libgtk-4-bin` (this binary) would build cleanly and then fail
      # `headless_smoke.rs` at run time with "failed to spawn
      # gtk4-broadwayd", which is exactly the trap that test's own doc
      # comment documents having hit once already while this was built.
      # `libadwaita-1-dev` is the same story one layer up, for
      # `apps/hop-gtk`'s libadwaita dependency.
      - name: Install GTK4 + libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libgtk-4-bin libadwaita-1-dev

      # Pinned to the exact version `rust-toolchain.toml` pins, not left on
      # `@stable`: an unpinned action would install whatever is newest that
      # day, and if that ever drifted from the version this repo's own
      # `rust-toolchain.toml` names, `cargo` would silently auto-install a
      # *second* toolchain to honour the override file (rustup resolves that
      # file ahead of whatever this step's `rustup default` sets — see the
      # comment there for how that was verified) instead of using the one
      # this step just installed. Keeping both pins equal is what makes this
      # step's install actually the one that runs, rather than a wasted
      # download. See `rust-toolchain.toml` for why 1.98.0 specifically is
      # pinned rather than floating (issue #223).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # A separate job, not a step in `ci`: it never compiles the workspace, so it
  # wants neither the rustfmt/clippy components nor the build cache — and, the
  # reason that matters, it reports as its own red check. "Supply chain failed"
  # and "a test failed" are different problems for a reviewer, and one job would
  # collapse them into a single status.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SHA-pinned, not `@v2` and not the `v2.1.1` tag it names: a gate whose job
      # is to stop dependency drift should not itself float. Bumping it is then a
      # deliberate edit with a diff.
      #
      # `command: check` with no arguments runs all four checks — advisories,
      # bans, licenses, sources — under the policy in `deny.toml` at the repo
      # root, so the gate is configured in a reviewed file rather than in flags
      # buried here. `arguments: ""` overrides the action's `--all-features`
      # default so `deny.toml`'s `[graph]` decides the feature set; the workspace
      # declares no optional features today, and the override is here for when
      # that stops being true.
      #
      # The advisory database is cloned over the network at run time, so an
      # outage or a rate limit turns this job red rather than green. That is the
      # right direction to fail — a gate that passes because it could not reach
      # the advisory list is worse than no gate — but it means a red `Supply
      # chain` check should be read before it is believed. If it proves flaky,
      # cache the database rather than making the check advisory.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""

  # A separate job, not a step in `ci`, for the same reason `supply-chain`
  # is one: a timing failure and a correctness failure are different
  # problems for a reviewer, and one job would collapse their statuses
  # together. This one *does* compile the workspace (in `--release`, unlike
  # `ci`'s debug build), so unlike `supply-chain` it does want the
  # rustfmt/clippy-less toolchain and the build cache.
  #
  # The four tests this job runs (`crates/hop-core/tests/latency.rs`) are
  # `#[ignore]`d specifically so `ci`'s own `cargo test --workspace` — a
  # debug build — never runs them: debug-mode Rust is 10-50x slower than
  # release for CPU-bound fuzzy matching, so a 10ms p95 budget measured in
  # debug mode would flake on ordinary, unregressed code. `--release` is
  # therefore load-bearing here, not a performance nicety.
  #
  # `--test-threads=1` keeps the four timing tests in this one small binary
  # from contending with each other for CPU during measurement, which
  # parallel test execution would otherwise do by default.
  #
  # Not every test this job runs still gates it. Two of the four arms are
  # report-only. The files-shaped p95 arm
  # (`p95_query_latency_over_a_files_shaped_fixture_is_measured_in_release_mode`,
  # issue #134) is report-only: it still builds in `--release`, still runs
  # under `--ignored`, and still prints its p95, but no longer asserts
  # against the 10ms budget — see that test's own doc comment for why. The
  # populated learning-store p95 arm
  # (`p95_query_latency_over_a_populated_learning_store_is_measured_in_release_mode`,
  # issue #149) is likewise report-only: it prints its figure and margin
  # against the reference without asserting a threshold, because no budget
  # exists yet. A red "Latency gate" check here still means a real regression
  # in one of the two arms that does assert
  # (`p95_query_latency_is_under_10ms_in_release_mode` and
  # `bounded_worst_case_completes_promptly_in_release_mode`); it does not mean
  # either report-only arm crossed its line, since neither can fail the build
  # on its own.
  latency-gate:
    name: Latency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version pin as `ci`'s toolchain step, for the same reason: see
      # the comment there and in `rust-toolchain.toml` (issue #223). This
      # step's own component list is untouched by the pin.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Latency gate
        run: cargo test --release -p hop-core --test latency -- --ignored --test-threads=1
