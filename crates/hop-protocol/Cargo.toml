[package]
name = "hop-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# For the `O_NONBLOCK` flag this crate's two filesystem-touching call sites
# both carry: `IconPath::open_regular_file` (`content.rs`, issue #131) and
# `config_file::read` (issue #182, the bounded, hazard-aware config-file
# read promoted out of `hopd::config`) — and for `mkfifo` in the test that
# covers each of them. std already links libc; this brings in the flag
# constant rather than a second implementation of it.
#
# These two are the first dependencies the contract crate has taken beyond serde
# and thiserror, and they arrived before this workspace had a supply-chain gate.
# It has one now — `deny.toml` at the repo root, run by the `Supply chain` job in
# CI — and they are checked by it like every other dependency, which is what the
# note that used to stand here asked for.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
