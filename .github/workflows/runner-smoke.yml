name: runner-smoke
on: workflow_dispatch

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, vps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version

      - name: Container runtime
        run: docker run --rm docker.io/library/hello-world

      - name: Rust toolchain
        run: |
          source "$HOME/.cargo/env"
          cargo --version

      - name: Resource sanity
        run: |
          free -h
          df -h /
