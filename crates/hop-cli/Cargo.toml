[package]
name = "hop-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hop"
path = "src/main.rs"

[dependencies]
# `version` alongside `path` for the reason given in `hop-core/Cargo.toml`: a
# bare path dependency is a wildcard requirement, which `cargo deny check
# bans` flags, and quieting the gate instead would mean marking this crate
# unpublishable to silence a lint that is right on the merits.
hop-protocol = { path = "../hop-protocol", version = "0.1.0" }
serde_json.workspace = true
# `dbus.rs`'s SASL `EXTERNAL` auth needs the process's real uid — one
# `libc::getuid` call, declared under the workspace's `unsafe_code = deny`
# lint like every other FFI touchpoint. Already a workspace dependency —
# `hop-protocol` (its config-file/content hazard tests) brought it in before
# `hopd` (the systemd socket descriptors) and `hop-hotkeyd` (the signalfd
# event loop) did — so this is a fourth consumer, not a new one.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
