[package]
name = "hopd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `version` alongside `path` for the reason given in `hop-core/Cargo.toml`: a
# bare path dependency is a wildcard requirement, which `cargo deny check
# bans` flags, and quieting the gate instead would mean marking this crate
# unpublishable to silence a lint that is right on the merits.
hop-core = { path = "../hop-core", version = "0.1.0" }
hop-protocol = { path = "../hop-protocol", version = "0.1.0" }
# `net` and `rt-multi-thread` add the accept loop and the multi-threaded
# runtime the brief requires on top of the workspace's `sync`, `time`,
# `macros`, `rt` set; `io-util` adds `AsyncReadExt`/`AsyncWriteExt` for the
# per-connection read/write loop. `process` is issue #162's: it swaps
# `SystemLauncher` from `std::process::Command` to `tokio::process::Command`
# so a spawned desktop-entry command has a reaping path instead of becoming
# a zombie when its `Child` handle is dropped — see `SystemLauncher`'s own
# doc comment in `apps.rs` for the full design decision. On Unix, `process`
# pulls in tokio's `signal` feature too (it is what drives the SIGCHLD-based
# fallback reaper `tokio::process` falls back to on kernels without pidfd
# support), which this crate did not otherwise need.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util", "process"] }
inotify.workspace = true
fasteval.workspace = true
# already a workspace dependency; ConfigError is thiserror-derived.
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Task 4 of docs/superpowers/plans/2026-08-09-issue-62-socket-activation.md:
# a pre_exec closure needs dup2/fcntl to hand a spawned test process a
# pre-bound fd at a fixed number, reproducing sd_listen_fds(3) without a
# real systemd session. libc is already a workspace dependency (used today
# by hop-protocol); this crate did not need it until this test.
libc.workspace = true

[lints]
workspace = true
