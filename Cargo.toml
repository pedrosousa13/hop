[workspace]
resolver = "2"
members = [
    "crates/hop-protocol",
    "crates/hop-core",
    "crates/hopd",
    "crates/hop-cli",
    "apps/hop-gtk",
    "crates/hop-hotkeyd",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/pedrosousa13/hop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nucleo-matcher = "0.3"
libc = "0.2"
inotify = { version = "0.11", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "rt"] }
tempfile = "3"
regex = "1"
# The v1 design spec names fasteval for the calculator provider (§5's
# providers table, M2.6 / issue #58). MIT — already covered by deny.toml's
# existing MIT allow-list entry, so this needs no new license line.
# `default-features = false` drops the crate's one feature, `alpha-keywords`
# (word operators `and`/`or`), which is also fasteval's *default* feature and
# which this provider has no use for.
fasteval = { version = "0.2", default-features = false }
# #60's config is TOML (spec §9), and there is no hand-rolled TOML parser worth
# writing — `toml` covers the file's parse with minimal surface. `serde` here
# is the feature that enables `toml::Value`/`toml::from_str` (the plan's
# `parse`-only spelling exposes only the low-level AST and no `from_str`); it
# pulls serde *core* into toml, not `display` — the config load is read-only —
# and needs no serde dependency in the consuming crate, because the config is
# read out of toml's own `Value` rather than derived. MIT/Apache-2.0, on
# `deny.toml`'s allow list.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# Issue #234's `hop-hotkeyd` speaks X11 directly: `XGrabKey` on the user's
# configured binding (design spec §2's X11 row) and `XTestFakeInput` in the
# crate's own end-to-end harness, which fakes the keypress a real keyboard
# would. The same pure-Rust-over-a-socket reasoning `apps/hop-gtk`'s
# identical dependency records applies verbatim — FFI into `libX11` would
# add the workspace's next `unsafe` block for calls a safe crate already
# wraps — so this is that entry promoted to the workspace level for a second
# consumer, not a new dependency. `xtest` is the one extension feature the
# crate enables (the grab itself is core protocol); MIT OR Apache-2.0, MIT
# arm on `deny.toml`'s allow list.
x11rb = { version = "0.13", features = ["xtest"] }

# Every member crate opts in with `[lints] workspace = true`. A workspace lint no
# crate inherits is a gate that does nothing, so any new member must do the same.
[workspace.lints.rust]
# This lint does not keep the workspace's production code free of `unsafe` —
# `hopd::server`'s `OwnedFd::from_raw_fd` (issue #62) is one, taking ownership
# of a systemd-activated socket descriptor. What it keeps is every `unsafe`
# block declared rather than smuggled in: the lint covers normal compilation
# of both members — `src/` and `#[cfg(test)]` code alike — so each one needs
# its own narrow `#[expect(unsafe_code)]` at the statement to build at all.
# As of issue #198 there are eight: that one production block, plus five
# test-only `libc::mkfifo`/`pre_exec` calls in `hop-protocol::content`,
# `hop-protocol`'s own `config_file` (the config-file read promoted out of
# `hopd::config` by issue #182), `hopd::config`, `hopd`'s
# `tests/activation.rs`, and `hopd::apps` (its own `mkfifo`, for the
# identical FIFO-open hazard `hopd::config` closes for the config file,
# closed here for a `.desktop` candidate), plus a second production block —
# `hop-gtk`'s `ui::window`, setting `XDG_ACTIVATION_TOKEN` before `present()`
# reads it back, on the GTK main thread — plus a third production block,
# `hop-gtk`'s `fonts::register_with_fontconfig`, calling
# `FcConfigAppFontAddDir` to register the crate's bundled typefaces (issue
# #198's own comment thread records the maintainer's approval of this
# specific exception to "no new `unsafe`", since no safe binding reaches
# this call on the pango/fontconfig versions this workspace targets — see
# `apps/hop-gtk/src/fonts.rs`'s doc comment, "Registering with
# fontconfig"). Each `expect` is itself the proof the lint reaches where
# it's written: were it not firing there, the unfulfilled expectation would
# warn, and CI's `-D warnings` would fail.
#
# What it does not cover is doc tests. Cargo hands `--deny=unsafe_code` to
# rustdoc — visible in `cargo test -p hop-protocol --doc -v` — but rustdoc
# compiles each ``` block as a separate crate and does not forward the flag to
# it, so an `unsafe` block in a doc comment compiles and passes
# `cargo test --workspace` with no attribute written anywhere and nothing for a
# grep to find. The exposure is narrow and worth stating plainly: a doc test is
# an example that runs in CI and ships in no binary, so what gets through is
# unsound documentation, not unsound hop. It is written down because the claim
# has to stop where the lint does. `grep -rn unsafe_code crates/` reads the
# exceptions the lint forced somebody to declare — useful, and not an audit,
# since it neither reaches doc tests nor distinguishes an attribute from prose
# about the rule.
#
# `deny` rather than `forbid` so that an exception is *possible* — a crate that
# has to talk to a C API should be able to, with a `SAFETY:` comment and a
# reviewer. `forbid` cannot be overridden anywhere, which would mean the next
# genuine need for FFI turns into a pull request that weakens this line for the
# whole workspace instead of one that annotates a single call.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
