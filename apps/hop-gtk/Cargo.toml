[package]
name = "hop-gtk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hop-gtk"
path = "src/main.rs"

[dependencies]
# `version` alongside `path` for the reason given in `hop-core/Cargo.toml`: a
# bare path dependency is a wildcard requirement, which `cargo deny check
# bans` flags.
hop-protocol = { path = "../../crates/hop-protocol", version = "0.1.0" }

# Issue #182's `keymap` module parses `[keymap]` out of `config.toml` —
# `toml` is already a workspace dependency (the root `Cargo.toml`'s own
# comment on it is `hopd::config`'s justification, which this crate's use is
# the same shape of: no hand-rolled TOML parser worth writing). Pulling it in
# here is not a *new* dependency, only a second consumer of one the workspace
# already vets and pins; `keymap.rs` reads out of `toml::Value` directly, the
# same low-level, `from_str`-only surface `hopd::config::parse` uses, so this
# needs no `serde` dependency of its own either.
toml.workspace = true

# `keymap::KeymapError` — one typed refusal per way loading a keymap can go
# wrong (criterion 4), the same shape `hopd::config::ConfigError` and
# `hop_protocol::config_file::ConfigFileError` already use `thiserror` for.
# Already a workspace dependency; this is a second consumer, not a new one.
thiserror.workspace = true

# GTK4 + libadwaita, pinned to the "v4_14" / "v1_5" API tier rather than the
# crates' latest — issue #179's environment note fixes this machine's GTK at
# 4.14.5 and libadwaita at 1.5.0 (GNOME 46). Enabling a newer version feature
# (e.g. `v4_18`) would let this crate call a symbol the installed `.so` does
# not export, which fails at *link* time with an obscure "undefined symbol"
# rather than a readable version error — so the feature tier is capped at
# what this machine (and the GNOME 46 target the design spec names) actually
# has, and raised deliberately, not by taking a crate's new default.
# Renamed to the ecosystem's usual short names (`gtk`, `adw`) at the
# `Cargo.toml` level rather than in every `use` — `libadwaita`'s own crate
# docs and most gtk4-rs applications do the same, and it is what keeps
# `gtk::Window` reading the way GTK's own C API and docs name the type,
# rather than `gtk4::Window` everywhere in this crate.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"

# `gtk4-layer-shell` where supported, per spec §8 — but the *crate* links
# against a system `.so` (`libgtk4-layer-shell`) at compile time through its
# own `-sys` crate's `pkg-config` probe in `build.rs`. Making it a plain,
# always-on dependency would mean `cargo build` fails outright on any machine
# without that library installed — including this one, per issue #179's
# confirmed environment note. So it is `optional = true`, gated behind the
# `layer-shell` feature (off by default), compiled in only when a builder
# opts in on a machine that actually has the library. `layer_shell.rs`'s
# runtime probe (`probe()`) reports "not compiled in" whenever this feature
# is off, which is always, in this environment — see that module's doc
# comment for the fallback path this makes the *default*, not a rarely-taken
# branch.
gtk4-layer-shell = { version = "0.8", optional = true }

# The bridge between the tokio client task (its own OS thread, its own
# runtime) and the GTK main thread's `glib::spawn_future_local` future — see
# `ipc`'s module doc for why this crate rather than `tokio::sync::mpsc`: its
# `Receiver::recv` is a plain `Future` with no `Send` requirement on the
# executor polling it, which is what lets it be awaited from a
# `glib::spawn_future_local` future (itself `!Send`, pinned to the glib main
# context) while its `Sender` half is sent to, and used from, a different
# thread entirely.
async-channel = "2"

# `net` for `tokio::net::UnixStream`, `io-util` for `AsyncReadExt` /
# `AsyncWriteExt` — the same two the workspace's `sync`, `time`, `macros`,
# `rt` set does not already carry. Unlike `hopd`, this crate needs no
# `rt-multi-thread`: the IPC thread runs one connection, exactly like
# `hop-cli`'s one-shot client (see that crate's module docs) except kept
# alive for the process's lifetime, so a single current-thread runtime
# (`tokio::runtime::Builder::new_current_thread`) is enough.
tokio = { workspace = true, features = ["net", "io-util"] }

# Issue #198's `fonts` module materializes the five bundled font faces to
# real files on disk, in a directory it holds for the process's lifetime —
# see that module's own doc comment for why disk, not memory (fontconfig
# 2.15.0 here has no `FcConfigAppFontAddMemFile`), and why a fresh
# `tempfile`-random directory under `$XDG_RUNTIME_DIR` rather than a fixed
# path (`--screenshot`'s `NON_UNIQUE` flag means several `hop-gtk` processes
# can run at once; a fixed path would let them collide). This promotes
# `tempfile` out of `[dev-dependencies]`, where it already lived as a
# test-only helper (`icon_roots.rs`'s own test module, still its biggest
# consumer) — production code now depends on the identical collision-safe
# random-suffix behavior those tests already relied on, not a second,
# differently-vetted temp-directory mechanism.
tempfile.workspace = true

# The FFI call `fonts::register_with_fontconfig` needs to reach
# `FcConfigAppFontAddDir` — issue #198's maintainer-approved waiver of "no
# new `unsafe`" for exactly this call site (`fonts.rs`'s own doc comment,
# "Registering with fontconfig", has the full argument for why no safe
# alternative exists on this machine's pango/fontconfig versions). MIT,
# already on `deny.toml`'s allow list. Raw bindings only — no vendored C
# source, no bundled `libfontconfig`: its `build.rs` runs `pkg-config` to
# link the system's own `libfontconfig.so` at compile time, the same
# mechanism every other `-sys` crate this workspace already depends on
# (`gtk4-layer-shell`, and every gtk-rs `-sys` crate underneath `gtk`/`adw`
# above) uses to find GTK4's own libraries. Left on this crate's default
# features — its `dlopen` feature would switch it to `dlopen(3)`-loading
# `libfontconfig` at runtime instead of linking it at compile time, which
# would need its own justification and is not what was verified while
# building this issue.
#
# "No vendored C source" is not "nothing else comes along": this crate pulls
# in two Rust dependencies of its own, unconditionally, whichever side of the
# `dlopen` feature above is taken — `[dependencies.dlib]` in
# `yeslogic-fontconfig-sys`'s own `Cargo.toml` carries no `optional = true`,
# and the `dlopen` feature above is an empty `[]` that does not even gate
# dlib's own `dlopen` feature, so `dlib` 0.5.3 (MIT) builds every time this
# crate does, and pulls in `libloading` 0.8.9 (ISC) under it, the crate `dlib`
# uses to load symbols by name. Both are already on `deny.toml`'s allow
# list — MIT and ISC are two of the five licenses it names — so nothing needs
# adding there for either. `cargo tree -i dlib` and `cargo tree -i libloading`
# each show the single path down from `hop-gtk` through
# `yeslogic-fontconfig-sys`, and re-check this claim.
yeslogic-fontconfig-sys = "6.0.1"

# Issue #232's X11 overlay path. GTK4 removed every window-positioning API
# (`gtk_window_move` and friends are gone, and GDK4 exposes no position on
# `gdk::Surface` at all), so "override-positioned window" — design spec §2's
# X11 row — can only be implemented by speaking to the X server directly:
# take the toplevel's XID from its surface and send a `ConfigureWindow` that
# centers it. Two dependencies make that possible, both justified here:
#
# `gdkx11` (the `gdk4-x11` crate) is the official gtk-rs binding for GDK's
# X11-specific API; this crate needs exactly two things from it —
# `X11Display`, so session detection (`session::SessionKind::detect`)
# downcasts the live `GdkDisplay` instead of guessing from environment
# variables, and `X11Surface::xid()`, the only public route to the XID the
# `ConfigureWindow` below targets. Its sibling `gdkwayland` (`gdk4-wayland`)
# is added for the symmetric reason: `WaylandDisplay` is how detection names
# the Wayland half of the Wayland-vs-X11 report M6's `hop doctor` consumes,
# compile-checked rather than string-matched. Both link system libraries
# (`libgtk-4-x11` / `libgtk-4-wayland`) that ship inside `libgtk-4-dev`,
# which this crate already required before this issue — so no new system
# prerequisite is introduced. Version "0.11" pins them alongside the
# `gdk4` 0.11.x already in the dependency graph under `gtk`; their MIT
# license is already on `deny.toml`'s workspace-wide allow list.
gdkx11 = { package = "gdk4-x11", version = "0.11" }
gdkwayland = { package = "gdk4-wayland", version = "0.11" }
#
# `x11rb` is the pure-Rust X11 client that actually sends the
# `ConfigureWindow`. The alternative was FFI into `libX11` (`x11-dl`),
# which would have added this workspace's next `unsafe` block for a call
# (`XMoveWindow`) a safe crate already wraps — x11rb speaks the X protocol
# over the display's own Unix socket with no unsafe code anywhere, which is
# why it is the one taken. It opens its *own* X connection (a second client
# connection alongside GDK's) because X requests between different clients
# carry no ordering guarantee against each other; that is harmless here —
# whether the move lands before or after the server processes GDK's map
# request, the window ends up at the configured position — and it means the
# move runs on a short-lived thread instead of the GTK main thread. MIT OR
# Apache-2.0: the MIT arm satisfies `deny.toml`'s allow list, per that
# file's note on deliberately not allowing the second arm of an OR.
x11rb = "0.13"

[build-dependencies]
# Issue #198's `build.rs` — this crate's first — compiles
# `assets/hop-gtk.gresource.xml` into the `.gresource` blob `src/fonts.rs`
# embeds with `gio::resources_register_include!`. MIT, already on
# `deny.toml`'s workspace-wide allow list, so this adds nothing new to
# `cargo deny check licenses`. See `build.rs`'s own doc comment for what
# this crate's one function, `compile_resources`, does and does not handle
# (in particular: the `glib-compile-resources` version this machine's
# `$PATH` happens to resolve first, and why that was verified rather than
# worked around).
glib-build-tools = "0.22"

[dev-dependencies]
# Not called directly by any test in this crate: declaring it here is what
# guarantees `cargo test -p hop-gtk` on its own builds the `hopd` binary
# before this crate's tests run, which `tests/headless_smoke.rs` needs since
# it locates `hopd`'s executable as `hop-gtk`'s own sibling in the shared
# workspace target directory (see that file's `hopd_path` for why: Cargo
# only guarantees a `CARGO_BIN_EXE_<name>` variable for a package's *own*
# binaries, not a dependency's, so the sibling-path trick is what stands in
# for it here).
# Issue #228's pixel regression assertions in `tests/headless_smoke.rs` decode
# this crate's own `--screenshot` PNG captures to sample the selected row's
# composited fill — the one colour claim nothing short of decoded pixels can
# defend (flat token colours stay pinned at the declaration level by the
# token-resolution tests, and capture geometry needs only the PNG header, no
# decode). Dev-only, so it ships in no binary — and it is not a new
# supply-chain surface either: Cargo.lock already resolves `gdk-pixbuf`
# 0.22.0 in every build of this crate, down the `gtk4`/`libadwaita` → `gdk4`
# → `gdk-pixbuf` path, so `"0.22"` pins the binding crate to the version the
# graph already carries rather than adding one. Its MIT license is already
# on `deny.toml`'s workspace-wide allow list, which is exactly why that file
# gains no entry for it.
gdk-pixbuf = "0.22"
hopd = { path = "../../crates/hopd", version = "0.1.0" }

[features]
# Off by default — see the `gtk4-layer-shell` dependency comment above.
layer-shell = ["dep:gtk4-layer-shell"]

[lints]
workspace = true
