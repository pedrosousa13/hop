[package]
name = "hopd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `version` alongside `path` for the reason given in `hop-core/Cargo.toml`: a
# bare path dependency is a wildcard requirement, which `cargo deny check
# bans` flags, and quieting the gate instead would mean marking this crate
# unpublishable to silence a lint that is right on the merits.
hop-core = { path = "../hop-core", version = "0.1.0" }
hop-protocol = { path = "../hop-protocol", version = "0.1.0" }
# `net` and `rt-multi-thread` add the accept loop and the multi-threaded
# runtime the brief requires on top of the workspace's `sync`, `time`,
# `macros`, `rt` set; `io-util` adds `AsyncReadExt`/`AsyncWriteExt` for the
# per-connection read/write loop. `process` is issue #162's: it swaps
# `SystemLauncher` from `std::process::Command` to `tokio::process::Command`
# so a spawned desktop-entry command has a reaping path instead of becoming
# a zombie when its `Child` handle is dropped — see `SystemLauncher`'s own
# doc comment in `apps.rs` for the full design decision. On Unix, `process`
# pulls in tokio's `signal` feature too (it is what drives the SIGCHLD-based
# fallback reaper `tokio::process` falls back to on kernels without pidfd
# support), which this crate did not otherwise need.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util", "process"] }
inotify.workspace = true
fasteval.workspace = true
# already a workspace dependency; ConfigError is thiserror-derived.
thiserror.workspace = true
toml.workspace = true
# Moved here from `[dev-dependencies]` by issue #160, for a reason that has
# since moved crates: `config.rs`'s `Config::from_path` used to open the
# config file with `O_NONBLOCK` (`std::os::unix::fs::OpenOptionsExt::custom_flags`)
# directly, so a FIFO at the config path could not block startup. Issue #182
# promoted that open/classify/read logic into `hop-protocol::config_file`,
# so `config.rs` itself no longer calls `libc` in production — but `apps.rs`
# does, unconditionally, for the identical `O_NONBLOCK` reason on a
# `.desktop` candidate's path (see `AcquireError::NotARegularFile`'s doc
# comment), which is what keeps this a plain dependency rather than a
# `cfg(unix)`-scoped one the way `hop-protocol`'s is — the same flag
# constant `hop-protocol`'s `IconPath::open_regular_file` uses for the same
# reason (issue #131). This crate has no non-Unix target (it binds a Unix
# domain socket unconditionally), so a `cfg(unix)` scope would buy nothing
# here anyway. Also used by three dev-only callers, noted where they live:
# one in `tests/activation.rs`, one in `src/apps.rs`'s own
# `#[cfg(test)] mod tests`, and one in `src/config.rs`'s own
# `#[cfg(test)] mod tests` (which still builds a real FIFO to prove
# `Config::from_path` refuses it via the promoted `hop-protocol` function,
# even though the `O_NONBLOCK` open itself no longer lives in this file).
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
